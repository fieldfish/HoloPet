# response_policy.yaml — 长短内容呈现策略字段示例
# schema-only: documented fields, not loaded by the current runtime.
#
# 短内容直接播报；长内容在屏幕完整显示，并播报 1~3 句摘要。
# 数值为默认值，可根据屏幕和语音体验调整。

response_policy:
  short_max_chars_zh: 100          # 超过即视为长回答
  short_max_tts_seconds: 20
  long_spoken_summary_max_chars_zh: 140
  long_display_mode: paged         # 分页 (EC11 CW/CCW 翻页, Pressed 返回)

agent_response:
  # 统一结构 (字段名已冻结; agentd 负责校验/补默认值/fallback)
  response_id: uuid
  route: remote                    # device | local | remote | tool
  model_used: provider/model
  text: "完整回答"
  display_text: "屏幕完整内容"
  speak_text: "语音内容 (长回答为 1~3 句摘要)"
  emotion: neutral
  expression: neutral
  voice_style: warm
  tool_calls: []

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-and-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++
          python -m pip install -r agent/requirements.txt
      - name: Build C++ core
        run: |
          cmake -S . -B build-core -G Ninja -DBUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-core
          ctest --test-dir build-core --output-on-failure
      - name: Test Python agent
        env:
          PYTHONPATH: agent
        run: python -m unittest discover -s agent/holopet_agentd/tests -t agent
